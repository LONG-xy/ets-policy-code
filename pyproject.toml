[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ets-policy-code"
version = "1.0.0"
description = "Code for the bi-level simulation-optimization model for emission caps and auction shares"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Xiaoyi Long"},
    {name = "Fanlin Meng", email = "F.Meng2@exeter.ac.uk"},
    {name = "Xiao-Jun Zeng"},
]
dependencies = ["numpy>=1.23,<3", "scipy>=1.9,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ets_code*"]
